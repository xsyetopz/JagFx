name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gradle-check:
    # macOS builds every target: JVM, Android, iOS simulator, JS and Wasm.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.0

      - run: ./gradlew check --continue

  js-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2.2.0

      - run: bun install --frozen-lockfile

      - run: ./gradlew :bindings:syncNpmPackages

      - run: bun run build:js

      - run: bun run typecheck

      - run: bun run test:js

  conventional-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2.2.0

      - run: bun install --frozen-lockfile

      - name: Validate commit messages
        run: >-
          bunx commitlint --verbose
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"

  ci-gate:
    needs: [gradle-check, js-packages, conventional-commits]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.gradle-check.result }}" == "failure" ]] || \
             [[ "${{ needs.js-packages.result }}" == "failure" ]] || \
             [[ "${{ needs.conventional-commits.result }}" == "failure" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed"
