name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish, for example v2.2.2
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  resolve-release-ref:
    name: Resolve release ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF_VALUE" == refs/tags/* ]]; then
            echo "ref=$GITHUB_REF_VALUE" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME_VALUE" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(_[0-9]+)?$ ]]; then
              echo "Invalid release_tag: $RELEASE_TAG"
              echo "Use format like v2.2.2 or v2.2.2_01"
              exit 1
            fi

            if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null; then
              echo "Release tag does not exist on origin: $RELEASE_TAG"
              echo "Create/push it first:"
              echo "git tag -a $RELEASE_TAG -m \"JagFx ${RELEASE_TAG#v}\""
              echo "git push origin $RELEASE_TAG"
              exit 1
            fi

            echo "ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ref=$GITHUB_REF_VALUE" >> "$GITHUB_OUTPUT"
          echo "tag=" >> "$GITHUB_OUTPUT"
          echo "is_release=false" >> "$GITHUB_OUTPUT"

  check:
    name: Check
    runs-on: macos-latest
    needs: resolve-release-ref
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve-release-ref.outputs.ref }}

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.0

      - run: ./gradlew check --continue

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: [resolve-release-ref, check]
    permissions:
      contents: read
    env:
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' &&
        secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_SIGN_IDENTITY != ''
        && secrets.MACOS_NOTARY_APPLE_ID != '' && secrets.MACOS_NOTARY_TEAM_ID
        != '' && secrets.MACOS_NOTARY_PASSWORD != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # jpackage builds only for the host architecture.
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve-release-ref.outputs.ref }}

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Validate notarization credentials
        id: validate-notary
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          if xcrun notarytool history \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" >/dev/null; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple notarization credentials were rejected. Building an unsigned DMG for this run. Refresh MACOS_NOTARY_PASSWORD with an app-specific password for MACOS_NOTARY_APPLE_ID and confirm MACOS_NOTARY_TEAM_ID to publish notarized macOS artifacts."
          fi

      - name: Import signing cert
        if: ${{ steps.validate-notary.outputs.valid == 'true' }}
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/jagfx-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/macos-signing.p12"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build signed and notarized DMG
        if: ${{ steps.validate-notary.outputs.valid == 'true' }}
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        # Compose signs the app and its bundled runtime, then notarizes and staples the DMG.
        run: >-
          ./gradlew :desktopApp:notarizeReleaseDmg
          -Pcompose.desktop.mac.sign=true
          "-Pcompose.desktop.mac.signing.identity=$MACOS_SIGN_IDENTITY"
          "-Pcompose.desktop.mac.signing.keychain=$KEYCHAIN_PATH"
          "-Pcompose.desktop.mac.notarization.appleID=$MACOS_NOTARY_APPLE_ID"
          "-Pcompose.desktop.mac.notarization.teamID=$MACOS_NOTARY_TEAM_ID"
          "-Pcompose.desktop.mac.notarization.password=$MACOS_NOTARY_PASSWORD"

      - name: Build unsigned DMG
        if: ${{ steps.validate-notary.outputs.valid != 'true' }}
        run: ./gradlew :desktopApp:packageReleaseDmg

      - name: Collect DMG
        run: |
          VERSION="$(sed -n 's/^version=//p' gradle.properties)"
          mkdir -p publish
          cp desktopApp/build/compose/binaries/main-release/dmg/*.dmg \
            "publish/JagFx-${VERSION}-macos-${{ matrix.arch }}.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jagfx-macos-${{ matrix.arch }}
          path: publish/*.dmg

  windows:
    name: Windows x64
    runs-on: windows-latest
    needs: [resolve-release-ref, check]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve-release-ref.outputs.ref }}

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.0

      - run: ./gradlew :desktopApp:packageReleaseMsi

      - name: Collect MSI
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version=//p' gradle.properties)"
          mkdir -p publish
          cp desktopApp/build/compose/binaries/main-release/msi/*.msi \
            "publish/JagFx-${VERSION}-windows-x64.msi"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jagfx-windows-x64
          path: publish/*.msi

  linux:
    name: Linux x64 + CLI
    runs-on: ubuntu-latest
    needs: [resolve-release-ref, check]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve-release-ref.outputs.ref }}

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.0

      # The CLI archive runs on any OS with Java 21 or later.
      - run: ./gradlew :desktopApp:packageReleaseDeb :cli:distZip

      - name: Collect DEB and CLI
        run: |
          VERSION="$(sed -n 's/^version=//p' gradle.properties)"
          mkdir -p publish
          cp desktopApp/build/compose/binaries/main-release/deb/*.deb \
            "publish/jagfx_${VERSION}_amd64.deb"
          cp "cli/build/distributions/jagfx-${VERSION}.zip" "publish/jagfx-cli-${VERSION}.zip"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jagfx-linux-x64
          path: |
            publish/*.deb
            publish/*.zip

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [resolve-release-ref, macos, windows, linux]
    if: ${{ needs.resolve-release-ref.outputs.is_release == 'true' }}
    # A tag push and a manual dispatch for the same tag must not create/upload the same release at once.
    concurrency:
      group: publish-release-${{ needs.resolve-release-ref.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve-release-ref.outputs.ref }}

      - uses: actions/download-artifact@v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.resolve-release-ref.outputs.tag }}
        run: |
          mapfile -t ASSETS < <(find release-artifacts -type f | sort)

          if (( ${#ASSETS[@]} == 0 )); then
            echo "no release artifacts found"
            exit 1
          fi

          printf 'release assets:\n'
          printf '  %s\n' "${ASSETS[@]}"

          TITLE="JagFx ${TAG_NAME#v}"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
            gh release edit "$TAG_NAME" --title "$TITLE" --latest
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" \
              --title "$TITLE" \
              --generate-notes \
              --verify-tag \
              --latest
          fi
