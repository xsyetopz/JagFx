name: Release

on:
  # A manual run builds the ref picked in "Use workflow from"; picking a tag publishes it. Jobs
  # check out that ref itself, never a chosen one, so the run stays in that ref's cache scope.
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  resolve-release-ref:
    name: Resolve release ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - id: resolve
        env:
          GITHUB_REF_VALUE: ${{ github.ref }}
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF_VALUE" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME_VALUE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(_[0-9]+)?$ ]]; then
              echo "::error::Release tag $GITHUB_REF_NAME_VALUE is not like v2.2.2 or v2.2.2_01"
              exit 1
            fi
            {
              echo "tag=$GITHUB_REF_NAME_VALUE"
              echo "is_release=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tag="
              echo "is_release=false"
            } >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Check
    runs-on: macos-latest
    timeout-minutes: 60
    needs: resolve-release-ref
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Check tag matches version
        if: ${{ needs.resolve-release-ref.outputs.is_release == 'true' }}
        env:
          TAG_NAME: ${{ needs.resolve-release-ref.outputs.tag }}
        run: |
          VERSION="$(sed -n 's/^version=//p' gradle.properties)"
          TAG_VERSION="${TAG_NAME#v}"
          TAG_VERSION="${TAG_VERSION%%_*}"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag $TAG_NAME does not match version=$VERSION in gradle.properties"
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no ## [$VERSION] entry"
            exit 1
          fi

      # No later run reads a tag's cache scope, so release jobs only restore caches; CI on main
      # writes them.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true
          gradle-home-cache-includes: |
            caches
            notifications
            nodejs
            binaryen

      - run: ./gradlew check --continue

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: resolve-release-ref
    permissions:
      contents: read
    env:
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' &&
        secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_SIGN_IDENTITY != ''
        && secrets.MACOS_NOTARY_APPLE_ID != '' && secrets.MACOS_NOTARY_TEAM_ID
        != '' && secrets.MACOS_NOTARY_PASSWORD != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # jpackage builds only for the host architecture.
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true

      - name: Validate notarization credentials
        id: validate-notary
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          if xcrun notarytool history \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" >/dev/null; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple notarization credentials were rejected. Building an unsigned DMG for this run. Refresh MACOS_NOTARY_PASSWORD with an app-specific password for MACOS_NOTARY_APPLE_ID and confirm MACOS_NOTARY_TEAM_ID to publish notarized macOS artifacts."
          fi

      - name: Import signing cert
        if: ${{ steps.validate-notary.outputs.valid == 'true' }}
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/jagfx-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/macos-signing.p12"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build signed and notarized DMG
        if: ${{ steps.validate-notary.outputs.valid == 'true' }}
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        # Compose signs the app and its bundled runtime, then notarizes and staples the DMG.
        run: >-
          ./gradlew :desktopApp:notarizeReleaseDmg
          -Pcompose.desktop.mac.sign=true
          "-Pcompose.desktop.mac.signing.identity=$MACOS_SIGN_IDENTITY"
          "-Pcompose.desktop.mac.signing.keychain=$KEYCHAIN_PATH"
          "-Pcompose.desktop.mac.notarization.appleID=$MACOS_NOTARY_APPLE_ID"
          "-Pcompose.desktop.mac.notarization.teamID=$MACOS_NOTARY_TEAM_ID"
          "-Pcompose.desktop.mac.notarization.password=$MACOS_NOTARY_PASSWORD"

      - name: Build unsigned DMG
        if: ${{ steps.validate-notary.outputs.valid != 'true' }}
        run: ./gradlew :desktopApp:packageReleaseDmg

      - name: Collect DMG
        run: |
          VERSION="$(sed -n 's/^version=//p' gradle.properties)"
          mkdir -p publish
          cp desktopApp/build/compose/binaries/main-release/dmg/*.dmg \
            "publish/JagFx-${VERSION}-macos-${{ matrix.arch }}.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jagfx-macos-${{ matrix.arch }}
          path: publish/*.dmg

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    needs: resolve-release-ref
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true

      - run: ./gradlew :desktopApp:packageReleaseMsi

      - name: Collect MSI
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version=//p' gradle.properties)"
          mkdir -p publish
          cp desktopApp/build/compose/binaries/main-release/msi/*.msi \
            "publish/JagFx-${VERSION}-windows-x64.msi"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jagfx-windows-x64
          path: publish/*.msi

  linux:
    name: Linux x64 + CLI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: resolve-release-ref
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: true

      # The CLI archive runs on any OS with Java 21 or later.
      - run: ./gradlew :desktopApp:packageReleaseDeb :cli:distZip

      - name: Collect DEB and CLI
        run: |
          VERSION="$(sed -n 's/^version=//p' gradle.properties)"
          mkdir -p publish
          cp desktopApp/build/compose/binaries/main-release/deb/*.deb \
            "publish/jagfx_${VERSION}_amd64.deb"
          cp "cli/build/distributions/jagfx-${VERSION}.zip" "publish/jagfx-cli-${VERSION}.zip"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jagfx-linux-x64
          path: |
            publish/*.deb
            publish/*.zip

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve-release-ref, check, macos, windows, linux]
    if: ${{ needs.resolve-release-ref.outputs.is_release == 'true' }}
    # A tag push and a manual dispatch for the same tag must not create/upload the same release at once.
    concurrency:
      group: publish-release-${{ needs.resolve-release-ref.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.resolve-release-ref.outputs.tag }}
        run: |
          mapfile -t ASSETS < <(find release-artifacts -type f | sort)

          if (( ${#ASSETS[@]} == 0 )); then
            echo "no release artifacts found"
            exit 1
          fi

          printf 'release assets:\n'
          printf '  %s\n' "${ASSETS[@]}"

          TITLE="JagFx ${TAG_NAME#v}"
          VERSION="$(sed -n 's/^version=//p' gradle.properties)"
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
            gh release edit "$TAG_NAME" --title "$TITLE" --notes-file release-notes.md --latest
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --verify-tag \
              --latest
          fi
